[project]
name = "quickbooks-online-sdk"
version = "0.1.0"
description = "Typed Python client for the QuickBooks Online Accounting API v3, with mechanically verified API coverage."
readme = "README.md"
license = "MIT"
authors = [{ name = "Ryan Gellis" }]
requires-python = ">=3.12"
keywords = ["quickbooks", "quickbooks-online", "qbo", "intuit", "accounting", "api"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Accounting",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.9",
]

[project.optional-dependencies]
# The official Intuit OAuth client. Runtime refresh is implemented directly in
# src/qbo/auth.py because it must be async and must persist the rotated token
# atomically before returning -- neither of which intuit-oauth does. The library
# is used for the one-time authorization-code bootstrap in
# scripts/get_refresh_token.py, which is sync and interactive.
bootstrap = ["intuit-oauth>=1.2.7"]
dev = [
    "pyright>=1.1.402",
    "pytest>=8.4.1",
    "pytest-asyncio>=1.0.0",
    "pytest-cov>=6.0.0",
    "respx>=0.21.1",
    "ruff>=0.8.0",
    "intuit-oauth>=1.2.7",
]

[project.urls]
Homepage = "https://github.com/rgellis/quickbooks-online-sdk"
Issues = "https://github.com/rgellis/quickbooks-online-sdk/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qbo"]

[tool.ruff]
target-version = "py312"
line-length = 88
indent-width = 4
fix = true
exclude = [".git", ".pytest_cache", ".ruff_cache", ".venv", "build", "dist", "refs"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
ignore = ["E501"]
fixable = ["ALL"]
unfixable = []

[tool.pyright]
include = ["src", "tests", "tools", "scripts"]
# tools/ is a flat script directory, not a package; tests import docsource from it.
extraPaths = ["src", "tools", "scripts"]
exclude = ["**/__pycache__", ".venv", "refs"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
reportMissingTypeStubs = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["src/qbo"]
branch = true

[tool.coverage.report]
# Held at 100, statements and branches. This package exists because numbers
# were trusted that nobody had checked; an untested branch in the code that
# does the checking is the same failure one level down. New code arrives with
# its tests or the suite fails.
fail_under = 100
show_missing = true
skip_covered = true
